# Azure DevOps Pipeline for Azure Local Deployment
# Generated by Odin for Azure Local

trigger:
  branches:
    include:
    - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  resourceGroupName: 'REPLACE_WITH_RESOURCE_GROUP_NAME'
  location: 'REPLACE_WITH_LOCATION'
  templateFile: 'azurelocal-template.json'
  parametersFile: 'azurelocal-parameters.json'

stages:
- stage: Validate
  displayName: 'Validate Template'
  jobs:
  - job: ValidateJob
    displayName: 'Validate ARM Template'
    steps:
    - task: AzureCLI@2
      displayName: 'Validate ARM Template'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az deployment group validate \
            --resource-group $(resourceGroupName) \
            --template-file $(templateFile) \
            --parameters @$(parametersFile)

- stage: Deploy
  displayName: 'Deploy Azure Local'
  dependsOn: Validate
  condition: succeeded()
  jobs:
  - deployment: DeployJob
    displayName: 'Deploy to Azure'
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: 'Deploy ARM Template'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az deployment group create \
                  --resource-group $(resourceGroupName) \
                  --template-file $(templateFile) \
                  --parameters @$(parametersFile) \
                  --mode Incremental
