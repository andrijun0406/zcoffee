# GitHub Actions Workflow for Azure Local Deployment
# Generated by Odin for Azure Local

name: Deploy Azure Local

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  RESOURCE_GROUP: REPLACE_WITH_RESOURCE_GROUP_NAME
  LOCATION: REPLACE_WITH_LOCATION
  TEMPLATE_FILE: azurelocal-template.json
  PARAMETERS_FILE: azurelocal-parameters.json

jobs:
  validate:
    name: Validate Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Validate ARM Template
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az deployment group validate \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --template-file ${{ env.TEMPLATE_FILE }} \
              --parameters @${{ env.PARAMETERS_FILE }}

  deploy:
    name: Deploy to Azure
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy ARM Template
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az deployment group create \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --template-file ${{ env.TEMPLATE_FILE }} \
              --parameters @${{ env.PARAMETERS_FILE }} \
              --mode Incremental

      - name: Deployment Summary
        run: |
          echo "## Deployment Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "Resource Group: ${{ env.RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
          echo "Location: ${{ env.LOCATION }}" >> $GITHUB_STEP_SUMMARY
